name = "nekodayo-docs"
compatibility_date = "2026-06-22"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "neko-apply-db"
database_id = "2763ef1f-1cbd-4a60-bd29-bb424d5093da"

# R2 存储桶绑定
[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "neko-apply-screenshots"

# Workers AI 绑定（免费额度 10000 neurons/天，用于指令意图路由）
# Pages 的 AI 绑定键名为 [ai]，model_name 不是绑定字段（模型在 env.AI.run() 中指定）
[ai]
binding = "AI"

# 敏感凭据不在 vars 中明文存放，请通过 wrangler secret 设置（提交前务必执行）：
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put API_TOKEN